# Tesla Gateway example configuration.

mapping_strategy: prefix

mappings:
  - { from: "192.168.1.0/24", to: "100.64.1.0/24" }
  # - { from: "100.68.0.0/16", to: "100.65.0.0/16" }   # Tailscale side
  # - { from: "10.243.0.0/16",  to: "100.66.0.0/16" }  # ZeroTier side

# Real networks that are in use. Mapped (to) prefixes must not overlap these.
# 100.64.0.0/24 is always reserved for local Tesla clients.
real_prefixes:
  - "192.168.0.0/16"

# Runtime statistics for LuCI (atomically replaced JSON). Empty uses
# /var/run/tesla-gateway/stats.json.
stats_path: "/var/run/tesla-gateway/stats.json"

dns:
  listen: "0.0.0.0:53"
  resolvers: [hosts, lease, system]
  # Ordered upstream priority list. Each item is an IPv4/IPv6 address or the
  # keyword "dhcp" (alias "auto"). "dhcp" expands in place to the DNS servers
  # assigned to the current default-route upstream interface via
  # `ubus call network.interface dump`, cached for ~10 seconds. If they cannot
  # be read (no ubus / no eligible interface), the item is skipped. Upstreams
  # are tried from top to bottom; timeout or failure moves to the next one.
  upstream: ["dhcp", "223.5.5.5", "119.29.29.29"]
  hosts_path: "/etc/hosts"
  lease_path: "/tmp/dhcp.leases"
  clamp_ttl: 300
  cache_max: 4096
  drop_aaaa: false

proxy:
  mode: nat
  tcp_listen: ":16464"
  # Keep false on a development machine. On OpenWrt, set true to install the
  # nftables redirect rules automatically.
  apply_nft: false
  # Never redirect local Tesla clients. Empty uses 100.64.0.0/24.
  local_client_prefix: "100.64.0.0/24"
  keepalive: 15s
  max_conns: 1024
  idle_timeout: 0

log:
  format: json
  level: info
