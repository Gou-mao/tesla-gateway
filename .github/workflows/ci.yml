name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
    steps:
      # 便携 checkout：不依赖 marketplace action，GitHub 与自建 Gitea runner 通用
      - name: checkout
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --depth 1 --branch "$REF" "${{ github.server_url }}/${{ github.repository }}.git" .

      - name: go version
        run: go version

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race -count=1 ./...

      - name: build (linux/arm64, static)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/tesla-gateway ./cmd/tg
