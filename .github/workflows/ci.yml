name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race -count=1 ./...

      - name: build (linux/arm64, static)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/tesla-gateway ./cmd/tg
